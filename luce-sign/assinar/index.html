<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Assinar documento | LUCE Sign</title><link rel="stylesheet" href="../style.css"></head>
<body><main class="sign-public"><header class="sign-public-brand"><strong>LUCE</strong> SIGN</header><section class="sign-public-panel"><p class="kicker">ASSINATURA ELETRÔNICA</p><h1 id="title">Carregando documento</h1><p id="identity"></p><p id="message" role="status"></p>
<div id="otpStep" hidden><p>Para visualizar o documento, informe o código de acesso recebido separadamente do link.</p><form id="otpForm"><label>Código de 6 dígitos<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary" type="submit">Confirmar código</button></form><div class="account-auth" id="accountAuth" hidden><p>Já possui uma conta confirmada no Portal Luce com este e-mail?</p><form id="accountForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha do Portal<input name="password" type="password" autocomplete="current-password" required></label><button class="quiet" type="submit">Entrar com conta do Portal</button></form></div></div>
<div id="signStep" hidden><p>Confira o documento completo antes de assinar.</p><div class="pdf-viewer"><canvas id="pdfCanvas" aria-label="Prévia do documento original"></canvas></div><div class="pdf-toolbar"><button class="quiet" id="prevPage" type="button" aria-label="Página anterior">Anterior</button><span id="pageLabel"></span><button class="quiet" id="nextPage" type="button" aria-label="Próxima página">Próxima</button></div><form id="signForm"><label>Digite seu nome completo<input name="name" autocomplete="name" required maxlength="160"></label><label class="consent"><input type="checkbox" name="consent" required> Li o documento e concordo em assiná-lo eletronicamente. Autorizo o registro de data, hora, endereço IP e informações do dispositivo como evidências.</label><button class="primary" type="submit">Assinar documento</button></form><button class="quiet" id="declineButton" type="button">Recusar assinatura</button></div>
<div id="doneStep" hidden><p>Sua assinatura foi registrada.</p><button class="quiet" type="button" id="downloadFinal">Baixar PDF final, quando disponível</button></div>
</section></main><script type="module" src="app.js"></script></body></html>
