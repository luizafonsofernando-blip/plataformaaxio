<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reforma Tributária | Portal Luce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Portal Luce">LUCE</a>
    <span class="product">Reforma Tributária</span>
    <button id="logout" type="button" hidden>Sair</button>
  </header>
  <main>
    <section id="loginView" class="login-view" aria-labelledby="loginTitle">
      <div class="login-panel">
        <p class="eyebrow">Portal Luce</p>
        <h1 id="loginTitle">Reforma Tributária</h1>
        <form id="loginForm">
          <label for="identifier">Usuário ou e-mail</label>
          <input id="identifier" name="identifier" autocomplete="username" required>
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
        </form>
        <p id="loginMessage" class="message" role="alert"></p>
      </div>
    </section>
    <section id="workspace" class="workspace" hidden aria-labelledby="workspaceTitle">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Luce Reforma Tributária</p>
          <h1 id="workspaceTitle">Prontidão das integrações</h1>
        </div>
        <span class="phase">Desenvolvimento e homologação</span>
      </div>
      <p id="workspaceMessage" class="message" role="status"></p>
      <table>
        <thead><tr><th>Motor oficial</th><th>Estado</th></tr></thead>
        <tbody id="engines"></tbody>
      </table>
      <section class="registry" aria-labelledby="registryTitle">
        <h2 id="registryTitle">Empresas</h2>
        <p id="registryMessage" class="message" role="status"></p>
        <form id="organizationForm" class="inline-form" hidden>
          <div><label for="organizationName">Nova organização</label><input id="organizationName" name="name" maxlength="160" required></div>
          <button type="submit">Criar organização</button>
        </form>
        <div id="registryContent" hidden>
          <label for="organizationSelect">Organização</label>
          <select id="organizationSelect"></select>
          <form id="companyForm" class="inline-form" hidden>
            <div><label for="companyCnpj">CNPJ</label><input id="companyCnpj" name="cnpj" inputmode="numeric" required></div>
            <div><label for="companyName">Razão social</label><input id="companyName" name="legal_name" maxlength="180" required></div>
            <div><label for="companyTradeName">Nome fantasia</label><input id="companyTradeName" name="trade_name" maxlength="180"></div>
            <button type="submit">Cadastrar empresa</button>
          </form>
          <table><thead><tr><th>CNPJ</th><th>Razão social</th><th>Nome fantasia</th></tr></thead><tbody id="companyRows"></tbody></table>
        </div>
      </section>
      <section class="catalog" aria-labelledby="catalogTitle">
        <h2 id="catalogTitle">Consulta de CST e cClassTrib</h2>
        <form id="catalogForm" class="catalog-form">
          <div>
            <label for="operationDate">Data da operação</label>
            <input id="operationDate" name="data" type="date" required>
          </div>
          <button type="submit">Consultar</button>
        </form>
        <p id="catalogMessage" class="message" role="status"></p>
        <p id="catalogSource" class="source" hidden></p>
        <div id="catalogResults" hidden>
          <label for="catalogFilter">Filtrar resultados</label>
          <input id="catalogFilter" type="search" placeholder="Código ou descrição">
          <table>
            <thead><tr><th>CST</th><th>Descrição</th><th>cClassTrib</th></tr></thead>
            <tbody id="catalogRows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
